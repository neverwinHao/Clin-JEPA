# Evaluation of a predictor trained on embeddings from the frozen Qwen base.
context: 24
steps: 48
horizons: [8, 24, 48]
batch_size: 16
embedding_dir: ${CLIN_JEPA_DATA}/embeddings
output_dir: ${CLIN_JEPA_OUTPUT}/rollout
predictor:
  state_dim: 4096
  action_dim: 4096
  static_dim: 4096
  hidden_dim: 1024
  num_layers: 6
  num_heads: 8
  ffn_dim: 4096
  max_timesteps: 72
models:
  qwen3_base:
    embeddings: qwen3_base
    predictor: ${CLIN_JEPA_OUTPUT}/predictor_qwen3_base/best.pt
