trajectory_dir: ${CLIN_JEPA_DATA}/trajectories
embedding_dir: ${CLIN_JEPA_DATA}/embeddings
output_dir: ${CLIN_JEPA_OUTPUT}/geometry

hours: 72

definitions:
  main: {deteriorating_delta: 3, stable_std: 1.0, stable_range: 2}
  delta2: {deteriorating_delta: 2, stable_std: 1.0, stable_range: 2}
  delta4: {deteriorating_delta: 4, stable_std: 1.0, stable_range: 2}
  stable_std_only: {deteriorating_delta: 3, stable_std: 1.0, stable_range: null}

subsample: {per_cohort: 50, seed: 42}
null_control: {relabelings: 20, seed: 7}
pool: {rows_per_shard: 400, seed: 0}
typical_distance: {pairs: 3000, seed: 1}
pca: {dim: 50, seed: 0}
neighbours: [5, 10, 20]
bootstrap: {draws: 1000, seed: 20368, direction_seed: [20368, 53]}
umap: {fit_samples: 100000, n_neighbors: 15, min_dist: 0.1, metric: cosine, seed: 42}

encoders:
  clin_jepa: {label: Clin-JEPA (ours), bootstrap_seed: 4}
  vjepa2ac: {label: V-JEPA 2-AC style, bootstrap_seed: 2}
  sft_baseline: {label: SFT baseline w/o JEPA, bootstrap_seed: 5}
