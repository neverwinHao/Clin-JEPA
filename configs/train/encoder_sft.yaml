# Encoder SFT: next-token fine-tuning of the LoRA on per-hour state and action texts.

model:
  base_model: Qwen/Qwen3-8B
  lora:
    r: 16
    alpha: 32
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
    dropout: 0.05
    bias: none
  attn_implementation: flash_attention_2
  gradient_checkpointing: true

data:
  trajectory_dir: ${CLIN_JEPA_DATA}/trajectories
  max_seq_len: 4096

training:
  epochs: 1
  effective_batch_size: 1024
  per_gpu_batch_size: 256
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  gradient_clip: 1.0
  seed: 42

logging:
  log_every: 50
  eval_every: 500
  eval_max_batches: 50

save:
  dir: ${CLIN_JEPA_OUTPUT}/encoder_sft

hf:
  offline: true
