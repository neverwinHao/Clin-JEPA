# End-to-end wiring check only. This small-sample run is not a scientific result.
predictor:
  state_dim: 4096
  action_dim: 4096
  static_dim: 4096
  hidden_dim: 1024
  num_layers: 6
  num_heads: 8
  ffn_dim: 4096
  max_timesteps: 72
  ffn_dropout: 0.15
  attn_dropout: 0.1

data:
  embedding_dir: ${CLIN_JEPA_DATA}/embeddings/qwen3_base

training:
  epochs: 2
  batch_size: 8
  gradient_accumulation_steps: 2
  eval_batch_size: 8
  lr: 5.0e-4
  weight_decay: 0.04
  warmup_ratio: 0.1
  gradient_clip: 1.0
  precision: bf16
  early_stopping_patience: 5
  embedding_noise_std: 0.01
  rollout_horizon: 2
  seed: 42

logging:
  log_every: 1

save:
  dir: ${CLIN_JEPA_OUTPUT}/predictor_qwen3_base_smoke
