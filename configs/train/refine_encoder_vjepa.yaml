# V-JEPA 2-AC style: random-mask JEPA refinement of the encoder.

model:
  base_model: Qwen/Qwen3-8B
  checkpoint_dir: ${CLIN_JEPA_OUTPUT}/encoder_sft/final
  attn_implementation: flash_attention_2
  gradient_checkpointing: true

jepa_predictor:
  embed_dim: 4096
  hidden_dim: 512
  num_layers: 3
  num_heads: 8
  ffn_dim: 2048
  dropout: 0.1
  max_position_id: 256

data:
  trajectory_dir: ${CLIN_JEPA_DATA}/trajectories
  max_seq_len: 4096

training:
  epochs: 1
  effective_batch_size: 32
  per_gpu_batch_size: 4
  lr_encoder: 5.0e-5
  lr_predictor: 5.0e-4
  weight_decay: 0.04
  warmup_ratio: 0.05
  gradient_clip_encoder: 0.5
  gradient_clip_predictor: 1.0
  mask_ratio: 0.40
  min_visible: 2
  tau_init: 0.996
  tau_final: 1.0
  collapse_guard: 0.05
  early_stop:
    patience: 5
    min_steps: 500
    min_delta: 0.001
  seed: 42

logging:
  log_every: 25
  eval_every: 250
  eval_max_windows: 100
  val_windows: 2000

save:
  dir: ${CLIN_JEPA_OUTPUT}/vjepa2ac

hf:
  offline: true
