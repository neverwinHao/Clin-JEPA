[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clin-jepa"
version = "0.1.0"
description = "A Multi-Phase Co-Training Framework for Joint-Embedding Predictive Pretraining on EHR Patient Trajectories"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Yixuan Yang", email = "yixuan.yang@duke.edu" },
    { name = "Mehak Arora" },
    { name = "Ryan Zhang" },
    { name = "Baraa Abed" },
    { name = "Junseob Kim" },
    { name = "Tilendra Choudhary" },
    { name = "Md Hassanuzzaman" },
    { name = "Kevin Zhu" },
    { name = "Ayman Ali" },
    { name = "Chengkun Yang" },
    { name = "Alasdair Edward Gent" },
    { name = "Victor Moas" },
    { name = "Rishikesan Kamaleswaran" },
]
keywords = [
    "jepa",
    "joint-embedding-predictive-architecture",
    "ehr",
    "clinical-machine-learning",
    "mimic-iv",
    "self-supervised-learning",
    "icu",
    "patient-trajectory",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "torch>=2.5,<3",
    "transformers>=4.48,<5",
    "peft>=0.14,<1",
    "accelerate>=1.2,<2",
    "liger-kernel>=0.5,<1",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=15",
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",
    "pyyaml>=6,<7",
    "matplotlib>=3.8,<4",
    "lightgbm>=4,<5",
    "umap-learn>=0.5,<1",
]

[project.optional-dependencies]
data-duckdb = ["duckdb>=1.1,<2"]
dev = [
    "ruff>=0.5",
    "pytest>=8",
]
clmbr = [
    "msgpack>=1,<2",
]

[project.urls]
Paper = "https://arxiv.org/abs/2605.10840"
Repository = "https://github.com/Kamaleswaran-Lab/Clin-JEPA"
Issues = "https://github.com/Kamaleswaran-Lab/Clin-JEPA/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["clin_jepa*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]
